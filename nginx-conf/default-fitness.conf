server {
    listen       8000 default_server;
    listen       [::]:8000 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Serve files or return 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?|ttf|eot|otf|mp4|webm)$ {
        try_files $uri $uri/ =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Deny hidden files (git, env, etc.)
    location ~ /\.|/\.git {
        deny all;
    }

    # SPA fallback (uncomment if using single-page app)
    # location / {
    #   try_files $uri $uri/ /index.html;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
