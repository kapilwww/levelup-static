name: Fitness Site - Build and Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: alias
  EX_NAME: ${{ vars.EX_NAME }}

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: My Ex Name
        run: | 
         echo "My name is ${{ env.EX_NAME }}"

      - name: Build and push fitness image to ECR
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            -f Dockerfile.fitness .

          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy_to_ec2:
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e

            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}"
            export AWS_DEFAULT_REGION="us-east-1"

            AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
            ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com"

            echo "Login to ECR on EC2"
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "Pull the latest fitness image"
            docker pull "$ECR_REGISTRY/fitness:latest"

            echo "Create config for Nginx"
            mkdir -p /home/${{ secrets.EC2_USERNAME }}/fitness-app
            cat > /home/${{ secrets.EC2_USERNAME }}/fitness-app/default.conf <<'EOF'
            server {
              listen 8000;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;

              location / {
                try_files $uri $uri/ /index.html;
              }
            }
            EOF

            echo "Restart the container"
            docker rm -f fitness-nginx || true

            docker run -d --name fitness-nginx \
              --restart unless-stopped \
              -p 8080:8000 \
              -v /home/${{ secrets.EC2_USERNAME }}/fitness-app/default.conf:/etc/nginx/conf.d/default.conf:ro \
              "$ECR_REGISTRY/fitness:latest"

            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

# GitHub secrets to add:
# - AWS_ACCESS_KEY_ID: AWS IAM access key for ECR access
# - AWS_SECRET_ACCESS_KEY: AWS IAM secret key
# - AWS_SESSION_TOKEN: only if your IAM user uses temporary session credentials
# - AWS_ACCOUNT_ID: Your AWS account ID
# - EC2_HOST: EC2 public IP or DNS
# - EC2_USERNAME: Example: ubuntu or ec2-user
# - EC2_SSH_KEY: Private key for EC2 login
# - EC2_PORT: Optional, default is 22
#
# How it works:
# 1. GitHub uses AWS access keys stored in secrets to log in to ECR
# 2. It builds the Docker image from Dockerfile.fitness
# 3. It pushes the image to Amazon ECR
# 4. GitHub connects to EC2 over SSH
# 5. EC2 uses the same AWS keys to pull the image from ECR and run it
